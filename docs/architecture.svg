<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" role="img" aria-label="Архитектура прогноза трамвайных валидаций">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#627d92"/></marker></defs>
<rect width="1600" height="1150" fill="#f8fafc"/>
<text x="50" y="69" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17324c">Архитектура прогноза трамвайных валидаций</text><text x="50" y="109" font-family="Arial,sans-serif" font-size="19" fill="#40556b">Пакетный ML → готовый CSV → FastAPI → дашборд · 10 маршрутов · ноябрь–декабрь 2025</text><text x="50" y="148" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17324c">1. Подготовка прогноза</text><rect x="50" y="160" width="285" height="205" rx="16" fill="#e9f3ff" stroke="#79abd5" stroke-width="2"/><text x="72" y="201" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17324c">Данные и шаблон</text><text x="72" y="242" font-family="Arial,sans-serif" font-size="17" fill="#40556b">labels_day_train.csv</text><text x="72" y="271" font-family="Arial,sans-serif" font-size="17" fill="#40556b">labels_day_test.csv</text><text x="72" y="300" font-family="Arial,sans-serif" font-size="17" fill="#40556b">test_submission.csv</text><text x="72" y="329" font-family="Arial,sans-serif" font-size="17" fill="#40556b">История до 31.10.2025</text><rect x="380" y="160" width="305" height="205" rx="16" fill="#e9f3ff" stroke="#79abd5" stroke-width="2"/><text x="402" y="201" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17324c">Подготовка сетки</text><text x="402" y="242" font-family="Arial,sans-serif" font-size="17" fill="#40556b">load_data.py</text><text x="402" y="271" font-family="Arial,sans-serif" font-size="17" fill="#40556b">72 960 почасовых ячеек</text><text x="402" y="300" font-family="Arial,sans-serif" font-size="17" fill="#40556b">10 маршрутов; пропуски → 0</text><text x="402" y="329" font-family="Arial,sans-serif" font-size="17" fill="#40556b">61 день для прогноза</text><rect x="730" y="160" width="820" height="205" rx="16" fill="#def5e8" stroke="#68b58d" stroke-width="2"/><text x="752" y="201" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17324c">Сезонный ансамбль по маршрутам</text><text x="752" y="243" font-family="Arial,sans-serif" font-size="17" fill="#40556b">features.py · маршрут × день недели × час</text><text x="752" y="272" font-family="Arial,sans-serif" font-size="17" fill="#40556b">Режимы: regular / summer / winter_break</text><text x="752" y="301" font-family="Arial,sans-serif" font-size="17" fill="#40556b">Среднее, медиана, усечённое и взвешенное среднее</text><text x="752" y="330" font-family="Arial,sans-serif" font-size="17" fill="#40556b">Отдельные веса; корректировка почасовых долей для 7 и 25</text><polyline points="335,260 375,260" fill="none" stroke="#627d92" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="685,260 725,260" fill="none" stroke="#627d92" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="50" y="420" width="445" height="190" rx="16" fill="#eef0ff" stroke="#919fd4" stroke-width="2"/><text x="72" y="461" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17324c">Временная проверка</text><text x="72" y="502" font-family="Arial,sans-serif" font-size="17" fill="#40556b">train.py · validate.py · metrics.py</text><text x="72" y="531" font-family="Arial,sans-serif" font-size="17" fill="#40556b">Май–июнь · июль–август</text><text x="72" y="560" font-family="Arial,sans-serif" font-size="17" fill="#40556b">Сентябрь–октябрь; октябрь отдельно</text><text x="72" y="589" font-family="Arial,sans-serif" font-size="17" fill="#40556b">Score = 1 − WAPE</text><rect x="535" y="420" width="445" height="190" rx="16" fill="#eef0ff" stroke="#919fd4" stroke-width="2"/><text x="557" y="461" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17324c">Артефакты модели</text><text x="557" y="502" font-family="Arial,sans-serif" font-size="17" fill="#40556b">seasonal_route_model.json — паспорт</text><text x="557" y="531" font-family="Arial,sans-serif" font-size="17" fill="#40556b">validation_scores.csv — оценки</text><text x="557" y="560" font-family="Arial,sans-serif" font-size="17" fill="#40556b">JSON не загружается при прогнозе:</text><text x="557" y="589" font-family="Arial,sans-serif" font-size="17" fill="#40556b">конфигурация задана в features.py</text><rect x="1020" y="420" width="530" height="190" rx="16" fill="#fff1d9" stroke="#dfa64d" stroke-width="2"/><text x="1042" y="461" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17324c">Сценарии будущего</text><text x="1042" y="502" font-family="Arial,sans-serif" font-size="17" fill="#40556b">interventions.py · рабочая суббота</text><text x="1042" y="531" font-family="Arial,sans-serif" font-size="17" fill="#40556b">Маршрут 5 с 16 декабря; T1 с 12 ноября</text><text x="1042" y="560" font-family="Arial,sans-serif" font-size="17" fill="#40556b">Маршруты 7 и 50: режим движения</text><text x="1042" y="589" font-family="Arial,sans-serif" font-size="17" fill="#40556b">T1 factor 0.90 — сценарное допущение</text><polyline points="950,365 950,392 272,392 272,415" fill="none" stroke="#627d92" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1290,365 1290,415" fill="none" stroke="#627d92" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="495,515 530,515" fill="none" stroke="#627d92" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="50" y="655" width="930" height="130" rx="16" fill="#ffffff" stroke="#c3cbd4" stroke-width="2"/><text x="72" y="696" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17324c">Временная граница</text><text x="72" y="737" font-family="Arial,sans-serif" font-size="17" fill="#40556b">Факты проверочного периода используются только для метрики.</text><text x="72" y="766" font-family="Arial,sans-serif" font-size="17" fill="#40556b">Прогноз ноября–декабря не получает будущие валидации.</text><rect x="1020" y="655" width="530" height="130" rx="16" fill="#def5e8" stroke="#68b58d" stroke-width="2"/><text x="1042" y="696" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17324c">Итоговый CSV</text><text x="1042" y="737" font-family="Arial,sans-serif" font-size="17" fill="#40556b">predict.py → submission.csv · 14 640 строк</text><text x="1042" y="766" font-family="Arial,sans-serif" font-size="17" fill="#40556b">route;date;hour;prediction · целые ≥ 0</text><polyline points="1290,610 1290,650" fill="none" stroke="#627d92" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="50" y="830" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17324c">2. Обслуживание готового прогноза</text><rect x="50" y="845" width="445" height="235" rx="16" fill="#e9f3ff" stroke="#79abd5" stroke-width="2"/><text x="72" y="886" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17324c">Загрузка при старте FastAPI</text><text x="72" y="927" font-family="Arial,sans-serif" font-size="17" fill="#40556b">CSV прогноза → pandas в памяти</text><text x="72" y="956" font-family="Arial,sans-serif" font-size="17" fill="#40556b">CSV остановок → география</text><text x="72" y="985" font-family="Arial,sans-serif" font-size="17" fill="#40556b">JSON событий → пояснения</text><text x="72" y="1051" font-family="Arial,sans-serif" font-size="16" fill="#40556b">Без БД и онлайн-инференса</text><rect x="535" y="845" width="445" height="235" rx="16" fill="#eef0ff" stroke="#919fd4" stroke-width="2"/><text x="557" y="886" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17324c">REST API</text><text x="557" y="927" font-family="Arial,sans-serif" font-size="17" fill="#40556b">/forecast · /forecast/routes</text><text x="557" y="956" font-family="Arial,sans-serif" font-size="17" fill="#40556b">/geo/route/{route} · /events/applied</text><text x="557" y="985" font-family="Arial,sans-serif" font-size="17" fill="#40556b">/export/csv · /export/xlsx · /health</text><text x="557" y="1051" font-family="Arial,sans-serif" font-size="16" fill="#40556b">Фильтры: маршрут, даты, час</text><rect x="1020" y="845" width="530" height="235" rx="16" fill="#fff1d9" stroke="#dfa64d" stroke-width="2"/><text x="1042" y="886" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17324c">Браузерный дашборд</text><text x="1042" y="927" font-family="Arial,sans-serif" font-size="17" fill="#40556b">График, таблица, карта остановок</text><text x="1042" y="956" font-family="Arial,sans-serif" font-size="17" fill="#40556b">День / месяц / весь горизонт</text><text x="1042" y="985" font-family="Arial,sans-serif" font-size="17" fill="#40556b">Отдельный сценарий «что если»</text><text x="1042" y="1051" font-family="Arial,sans-serif" font-size="16" fill="#40556b">Не меняет сохранённый прогноз</text><polyline points="1290,785 1290,811 25,811 25,960 45,960" fill="none" stroke="#627d92" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="495,960 530,960" fill="none" stroke="#627d92" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="980,960 1015,960" fill="none" stroke="#627d92" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="50" y="1124" font-family="Arial,sans-serif" font-size="17" fill="#40556b">Исходники приложения находятся в backend/; карта есть для маршрутов 1, 5, 7, 11 и 12.</text>
</svg>