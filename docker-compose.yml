# docker-compose нужен, чтобы одной командой (docker compose up) собрать
# образ и запустить контейнер с правильными настройками (порт, перезапуск
# при сбое) — без этого файла пришлось бы вручную набирать длинную команду
# docker build + docker run с кучей флагов.

services:
  backend:
    # build: . значит "собери образ из Dockerfile в этой же папке"
    build: .
    # Пробрасываем порт 8000 из контейнера на порт 8000 компьютера жюри.
    # Формат "снаружи:внутри" — если 8000 на компьютере жюри уже занят,
    # можно поменять только левое число, например "8080:8000", тогда
    # сайт откроется на http://localhost:8080
    ports:
      - "8000:8000"
    # Если контейнер упадёт (например, при нехватке памяти) — Docker
    # перезапустит его автоматически, "unless-stopped" значит "не трогать
    # только если его остановили вручную".
    restart: unless-stopped
